<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="t d">
  <title id="t">hostops: UPS state to GPU power limit</title>
  <desc id="d">Mains on: 550 W. On battery: 200 W. State unknown: 200 W. It never fails open.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Helvetica,Arial,sans-serif}</style>
  <rect width="640" height="300" rx="12" fill="#0f172a"/>
  <rect x="0.5" y="0.5" width="639" height="299" rx="11.5" fill="none" stroke="#1e293b"/>
  <path d="M34 0V27" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="30" y="26" width="8" height="6" rx="1.5" fill="#cbd5e1"/>
  <circle cx="34" cy="44" r="9" fill="#fbbf24"/>
  <text class="s" x="62" y="52" font-size="22" fill="#94a3b8">What the UPS reports</text>
  <text class="s" x="608" y="52" font-size="22" fill="#94a3b8" text-anchor="end">GPU power limit</text>
  <text class="s" x="62" y="112" font-size="28" fill="#f8fafc">Mains on</text>
  <path d="M300 103H452" stroke="#64748b" stroke-width="2.5"/>
  <path d="M452 96l14 7-14 7z" fill="#64748b"/>
  <text class="s" x="608" y="112" font-size="30" font-weight="700" fill="#f8fafc" text-anchor="end">550 W</text>
  <text class="s" x="62" y="174" font-size="28" fill="#f8fafc">On battery</text>
  <path d="M300 165H452" stroke="#64748b" stroke-width="2.5"/>
  <path d="M452 158l14 7-14 7z" fill="#64748b"/>
  <text class="s" x="608" y="174" font-size="30" font-weight="700" fill="#fbbf24" text-anchor="end">200 W</text>
  <text class="s" x="62" y="236" font-size="28" fill="#f8fafc">State unknown</text>
  <path d="M300 227H452" stroke="#64748b" stroke-width="2.5"/>
  <path d="M452 220l14 7-14 7z" fill="#64748b"/>
  <text class="s" x="608" y="236" font-size="30" font-weight="700" fill="#fbbf24" text-anchor="end">200 W</text>
  <text class="s" x="62" y="282" font-size="20" fill="#94a3b8">It never fails open: when in doubt, 200 W.</text>
